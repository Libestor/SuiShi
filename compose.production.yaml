name: suishu

# Production topology for a single-host deployment. The host Nginx terminates
# TLS, performs Basic Auth, and directly proxies to the two loopback services.
services:
  runner:
    build:
      context: ./runner
    init: true
    restart: unless-stopped
    environment:
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET:?set RUNNER_SHARED_SECRET in .env}
      RUNNER_CACHE_DIR: /runner-cache
      RUNNER_MAX_TIMEOUT_SECONDS: 60
      RUNNER_BUILDER_USER: runner-builder
      RUNNER_EXEC_USER: runner-exec
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
      - /runner-cache:size=512m,mode=0755,nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    networks:
      - runner_control
      - runner_egress
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/data/suishu.sqlite3
      PLATFORM_TOKEN: ${PLATFORM_TOKEN:?set PLATFORM_TOKEN in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SESSION_COOKIE_SECURE: "true"
      RUNNER_URL: http://runner:9000
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET:?set RUNNER_SHARED_SECRET in .env}
      # Leave empty by default: the host proxy is not trusted to supply a
      # client identity, so untrusted X-Forwarded-For values are ignored.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      SNAPSHOT_INTERVAL_MINUTES: ${SNAPSHOT_INTERVAL_MINUTES:-60}
      SCHEDULER_ENABLED: "true"
      DATA_SOURCE_REPO: /app/data/data-sources
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    networks:
      - runner_control
      - backend_egress
    depends_on:
      runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - frontend
    depends_on:
      backend:
        condition: service_healthy

networks:
  runner_control:
    internal: true
  frontend:
  backend_egress:
  runner_egress:
